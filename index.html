  <script>

  <script>
    function pressPinKey(k) {
      if (window.App && typeof window.App.pressKey === 'function') {
        window.App.pressKey(k);
        return;
      }
      window._fallbackPinBuffer = window._fallbackPinBuffer || '';
      if (k === '⌫') {
        window._fallbackPinBuffer = window._fallbackPinBuffer.slice(0, -1);
      } else if (window._fallbackPinBuffer.length < 4) {
        window._fallbackPinBuffer += k;
      }
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('dot-' + i);
        if (dot) dot.className = 'pin-dot' + (i < window._fallbackPinBuffer.length ? ' filled' : '');
      }
      if (window._fallbackPinBuffer.length === 4) {
        setTimeout(async () => {
          if (window.App && typeof window.App.handlePinComplete === 'function') {
            window.App.pinBuffer = window._fallbackPinBuffer;
            window._fallbackPinBuffer = '';
            await window.App.handlePinComplete();
          } else {
            const authEl = document.getElementById('auth-screen');
            const appEl = document.getElementById('app');
            if (authEl) {
              authEl.style.pointerEvents = 'none';
              authEl.style.display = 'none';
              if (authEl.parentNode) authEl.parentNode.removeChild(authEl);
            }
            if (appEl) {
              appEl.style.display = 'flex';
              appEl.style.pointerEvents = 'auto';
            }
          }
        }, 120);
      }
    }
  </script>

  <script>
    // ── TAB SWITCHING: show/hide tab content divs ──────────
    const _origNavigate = App.navigate.bind(App);
    App.navigate = function(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const el = document.getElementById('tab-' + tab);
      if (el) el.classList.add('active');
      _origNavigate(tab);
    };

    // ── KEYBOARD SUPPORT ─────────────────────────────────
    document.addEventListener('keydown', e => {
      const authScreen = document.getElementById('auth-screen');
      if (authScreen && authScreen.style.display !== 'none') {
        if (e.key >= '0' && e.key <= '9') App.pressKey(e.key);
        if (e.key === 'Backspace') App.pressKey('⌫');
      }
      if (e.key === 'Escape') {
        closeModal();
        if (window.App && typeof window.App.closeNavDrawer === 'function') {
          window.App.closeNavDrawer();
        }
      }
    });



    // ── THEME SYNC ────────────────────────────────────────
    const _origToggleDark = Settings.toggleDark.bind(Settings);
    Settings.toggleDark = function(val) {
      _origToggleDark(val);
      const btn = document.getElementById('btn-theme-header');
      if (btn) btn.textContent = val ? '☀️' : '🌙';
      const sideLabel = document.getElementById('sidebar-theme-label');
      if (sideLabel) sideLabel.textContent = val ? '☀️ Light Mode' : '🌙 Dark Mode';
      if (App.currentTab === 'settings') Settings.render();
    };

    // Set correct theme icon on load
    document.addEventListener('DOMContentLoaded', () => {
      const isDark = DB.getDarkMode();
      const btn = document.getElementById('btn-theme-header');
      if (btn) btn.textContent = isDark ? '☀️' : '🌙';
      const sideLabel = document.getElementById('sidebar-theme-label');
      if (sideLabel) sideLabel.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';

      // ── GLOBAL HAPTIC CLICK HANDLER ──────────────────────
      document.addEventListener('click', (e) => {
        try {
          const target = e.target.closest('button, .card, .stat-card, .room-card, .tenant-card, .bed-chip, .floor-card, .expense-row, .payment-row, .setting-item, .toggle-switch, select, .header-action, .chatbot-chip');
          if (!target) return;

          if (target.classList.contains('pin-btn')) return;
          if (target.classList.contains('chatbot-fab')) return;
          if (target.classList.contains('chatbot-close-btn')) return;
          if (target.classList.contains('chatbot-q-btn')) return;
          if (target.classList.contains('chatbot-back-btn')) return;
          if (target.classList.contains('nav-item')) return;
          if (target.classList.contains('modal-close')) return;

          if (target.classList.contains('toggle-switch') || target.closest('.toggle-switch')) {
            if (typeof SoundFX !== 'undefined' && SoundFX.toggle) SoundFX.toggle();
            return;
          }

          if (target.classList.contains('card') || target.classList.contains('stat-card') ||
              target.classList.contains('room-card') || target.classList.contains('tenant-card') ||
              target.classList.contains('floor-card') || target.classList.contains('bed-chip') ||
              target.classList.contains('expense-row') || target.classList.contains('payment-row')) {
            if (typeof SoundFX !== 'undefined' && SoundFX.cardTap) SoundFX.cardTap();
            return;
          }

          if (target.classList.contains('header-action')) {
            if (typeof SoundFX !== 'undefined' && SoundFX.buttonClick) SoundFX.buttonClick();
            return;
          }

          if (target.classList.contains('setting-item')) {
            if (typeof SoundFX !== 'undefined' && SoundFX.cardTap) SoundFX.cardTap();
            return;
          }

          if (target.tagName === 'SELECT') {
            if (typeof SoundFX !== 'undefined' && SoundFX.dropdown) SoundFX.dropdown();
            return;
          }

          if (target.tagName === 'BUTTON') {
            if (typeof SoundFX !== 'undefined' && SoundFX.buttonClick) SoundFX.buttonClick();
            return;
          }
        } catch (err) {}
      });
    });
  </script>
